<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Fanzine Trivia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'neon-red': '#ff003c',
              'neon-gold': '#ffd700',
              'deep-red': '#4a0404',
              'curtain-red': '#800020',
            },
            animation: {
              'bounce-slow': 'bounce 3s infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'flicker': 'flicker 2s infinite',
            },
            keyframes: {
              flicker: {
                '0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100%': {
                  opacity: '0.99',
                  filter: 'drop-shadow(0 0 1px rgba(255, 215, 0, 1)) drop-shadow(0 0 15px rgba(255, 215, 0, 0.5))'
                },
                '20%, 21.999%, 63%, 63.999%, 65%, 69.999%': {
                  opacity: '0.4',
                  filter: 'none'
                }
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Roboto+Slab:wght@400;700&display=swap');
      body {
        font-family: 'Roboto Slab', serif;
        background-color: #1a0505;
        color: white;
        overflow-x: hidden;
      }
      .font-neon {
        font-family: 'Righteous', cursive;
      }
    </style>
